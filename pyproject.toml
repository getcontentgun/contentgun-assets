[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]
src = [".", "mcp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The folder mcp/ would otherwise make the SDK of the same name look first-party.
known-third-party = ["mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["mcp"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["requires_chromium: needs a Playwright Chromium installation"]
